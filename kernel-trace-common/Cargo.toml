[package]
name = "kernel-trace-common"
version = "0.1.0"
edition.workspace = true

[features]
# 启用与 aya 用户态交互所需 trait（Pod / 字节转换）
default = []
user = ["dep:aya"]

[dependencies]
aya = { workspace = true, optional = true }

# 共享类型：
# - 与 ldmonitor-common 保持同样的 #[repr(C)] + Pod 模式
# - 与 stackplz 的 syscall_data_event_t / hook_data_event_t 字段一致
