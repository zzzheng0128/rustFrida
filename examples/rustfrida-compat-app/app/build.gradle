plugins {
    id "com.android.application"
}

android {
    namespace "com.rustfrida.compatdemo"
    compileSdk 34

    defaultConfig {
        applicationId "com.rustfrida.compatdemo"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none"
                cFlags "-O2"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    // Keep the demo .so as an extracted file on Android.  This gives the
    // uprobe resolver a real /data/app/.../libcompatdemo.so path instead of
    // the Pixel 6 `base.apk!/lib/...` pseudo path.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
